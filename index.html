    <meta name="theme-color" content="#070a08" />
    <meta name="description" content="FITCOACH Professional - gestão de alunos, treinos, atlas muscular, agenda, planos, chat e evolução para personal trainers" />

    <link rel="manifest" href="/manifest.webmanifest" />
