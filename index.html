<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a08" />
    <meta name="description" content="FITCOACH Professional - gestão de alunos, treinos, atlas muscular 3D, agenda, planos, chat e evolução para personal trainers" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FITCOACH" />
    <title>FITCOACH Professional</title>
    <link rel="stylesheet" href="./mobile-layout-fix.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const app = document.getElementById('app')
        if (!app) return
        app.innerHTML = '<section style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#070a08;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif"><div style="text-align:center"><div style="font-size:11px;letter-spacing:.16em;opacity:.55;font-weight:800">FITCOACH PROFESSIONAL</div><div style="width:30px;height:30px;margin:18px auto;border:3px solid rgba(255,255,255,.12);border-top-color:#72e3a0;border-radius:50%;animation:fcspin .8s linear infinite"></div><strong style="font-size:18px">Carregando FITCOACH…</strong></div></section><style>@keyframes fcspin{to{transform:rotate(360deg)}}</style>'

        const VERSION = 'v26'
        const VERSION_KEY = 'fitcoach_boot_version'
        const cleaned = localStorage.getItem(VERSION_KEY) === VERSION

        const resetPwa = async () => {
          try {
            if ('serviceWorker' in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations()
              await Promise.all(regs.map(r => r.unregister()))
            }
            if ('caches' in window) {
              const keys = await caches.keys()
              await Promise.all(keys.map(k => caches.delete(k)))
            }
            localStorage.setItem(VERSION_KEY, VERSION)
          } catch (error) {
            console.warn('FITCOACH PWA reset skipped', error)
          }
        }

        if (!cleaned) {
          resetPwa().finally(() => {
            const url = new URL(window.location.href)
            url.searchParams.set('fc-refresh', VERSION)
            window.location.replace(url.toString())
          })
        }
      })()
    </script>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
